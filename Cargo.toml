[package]
name = "bastion"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tower-cookies = "0.10"

sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "macros", "migrate"] }

maud = { version = "0.26", features = ["axum"] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
josekit = "0.10"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

rand = "0.8"
sha2 = "0.10"
hex = "0.4"
data-encoding = "2"
url = "2"
urlencoding = "2"

anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
